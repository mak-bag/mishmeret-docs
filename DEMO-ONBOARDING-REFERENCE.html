<style>
:root{--stage:#EEF3FB;--ink:#0B1630;--muted:#3D4B66;--soft:#64748B;--blue:#1257D6;--line:#D9DFEA;--card:#FFFFFF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#0A1226;--ink:#EAF0FB;--muted:#B7C4DD;--soft:#8A97AD;--line:#24324F;--card:#111C36}}

*{box-sizing:border-box}
body{margin:0;background:var(--stage);font-family:'Heebo',system-ui,sans-serif;color:var(--ink);direction:rtl}
.stage{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px;align-items:center;max-width:1180px;margin:0 auto;padding:40px 24px}

.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;margin-bottom:28px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(18,87,214,.12);color:var(--blue);font-weight:600;font-size:14px}
h1{font-weight:900;font-size:clamp(34px,4.4vw,56px);line-height:1.04;letter-spacing:-.02em;margin:16px 0 14px}
.lead{font-size:18px;line-height:1.65;color:var(--muted);margin:0 0 28px;max-width:520px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-width:520px}
.steps li{display:flex;gap:14px;padding:12px 14px;border-radius:14px;cursor:pointer;transition:background .25s ease}
.steps li:hover{background:rgba(18,87,214,.06)}
.steps .n{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--card);border:1.5px solid var(--line);color:var(--soft);transition:all .3s ease}
.steps .t{font-weight:700;font-size:16px}.steps .d{font-size:14px;line-height:1.5;color:var(--soft);max-height:0;overflow:hidden;transition:max-height .4s ease,margin .3s ease}
.steps li.on{background:var(--card);box-shadow:0 10px 30px -18px rgba(11,22,48,.35)}
.steps li.on .n{background:var(--blue);border-color:var(--blue);color:#fff}
.steps li.on .d{max-height:80px;margin-top:4px}
.ctrl{display:flex;gap:10px;margin-top:22px;align-items:center}
.cbtn{height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 15px 'Heebo',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.cbtn.p{background:var(--blue);border-color:var(--blue);color:#fff}
.note{font-size:13px;color:var(--soft);margin-top:14px}
.phoneWrap{position:relative}
.glowbg{position:absolute;inset:-60px;background:radial-gradient(closest-side,rgba(18,87,214,.22),transparent);pointer-events:none;animation:breath 6s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.08);opacity:.7}}
.phone{position:relative;width:390px;height:844px;border-radius:56px;padding:12px;background:#0B1630;box-shadow:0 2px 4px rgba(11,22,48,.1),0 40px 80px -30px rgba(11,22,48,.55)}
@media (max-height:900px){.phone{transform:scale(.8);transform-origin:top center;margin-bottom:-170px}}
@media (max-width:440px){.phone{transform:scale(.86);transform-origin:top center;margin-bottom:-120px}}
.screen{position:relative;width:366px;height:820px;border-radius:44px;overflow:hidden;background:#fff;color:#0B1630}
.notch{position:absolute;top:10px;left:50%;margin-left:-55px;width:110px;height:30px;border-radius:16px;background:#0B1630;z-index:20}
.cursor{position:absolute;z-index:30;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:rgba(18,87,214,.25);border:2px solid rgba(18,87,214,.9);pointer-events:none;transition:top .6s cubic-bezier(.4,0,.2,1),left .6s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0}
.cursor.tap{animation:tap .35s ease}
@keyframes tap{50%{transform:scale(.7);background:rgba(18,87,214,.5)}}
.app button{font-family:'Heebo',sans-serif}
.press{transition:transform .15s ease,background .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease}.press:active{transform:scale(.97)}
.inS{animation:inS .45s cubic-bezier(.2,.8,.2,1) both}@keyframes inS{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.up{animation:up .5s cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.22s}
.sl{animation:sl .55s cubic-bezier(.2,.8,.2,1) both}@keyframes sl{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.fl{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-6px)}}
.ring{animation:ring 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes ring{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.7);opacity:0}}
.drop{animation:drop .6s cubic-bezier(.3,1.5,.5,1) both}@keyframes drop{from{transform:translateY(-26px);opacity:0}to{transform:none;opacity:1}}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.ck{stroke-dasharray:1;stroke-dashoffset:1;animation:ck .5s cubic-bezier(.6,.1,.3,1) .15s forwards}@keyframes ck{to{stroke-dashoffset:0}}
.caret{display:inline-block;width:2px;height:18px;background:#1257D6;margin-inline-start:1px;vertical-align:middle;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.cta{position:relative;overflow:hidden}
.cta::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:translateX(130%) skewX(-18deg);animation:sheen 4.5s ease-in-out 1s infinite;pointer-events:none}
@keyframes sheen{0%{transform:translateX(130%) skewX(-18deg)}55%,100%{transform:translateX(-260%) skewX(-18deg)}}
.cta.off::after{display:none}
.fillbar{position:relative;overflow:hidden}.fillbar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);animation:fb 1.8s ease-in-out infinite}@keyframes fb{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.glow{animation:glow 2.6s ease-in-out infinite}@keyframes glow{50%{filter:drop-shadow(0 0 6px rgba(18,87,214,.6))}}
.burst{position:absolute;inset:0;border-radius:50%;border:2px solid #1877F2;animation:burst 1.6s ease-out .2s infinite}.b2{animation-delay:.8s}@keyframes burst{to{transform:scale(2.2);opacity:0}}
.rad{transition:r .5s cubic-bezier(.2,.8,.2,1)}
.chip{height:42px;padding:0 15px;border-radius:12px;border:1.5px solid #D9DFEA;background:#fff;color:#0B1630;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip.on{background:#0B1630;border-color:#0B1630;color:#fff}
.scroll{overflow-y:auto;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
@media (prefers-reduced-motion: reduce){*,*::after{animation:none !important;transition:none !important}.ck{stroke-dashoffset:0}}
</style>

 return{title:sk?'הכול מוכן, דנה.':'הכול מוכן, קפה הים.',sub:sk?'הנה מה שהגדרת. מחכות לך מודעות בטווח.':'הנה מה שהגדרתם. עכשיו נפרסם את המודעה הראשונה.',tipT:'אפשר לחזור לסיור:',tipB:'כפתור "?" בראש כל מסך מראה את ההסבר שוב.',ok:true};
}

}
